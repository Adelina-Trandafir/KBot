# Slice 0110-04: the host that asks the browser for a client certificate (digital-certificate sign-in).
# Goes to /etc/nginx/sites-available/cert-kbot-ro on the VPS (symlinked in sites-enabled).
# Needs /etc/nginx/ca/calificate.pem (built by build-calificate.sh) and the Let's Encrypt certificate
# of cert.k-bot.ro. The main host (k-bot.ro) never asks for a certificate.

server {
    listen 80;
    server_name cert.k-bot.ro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://cert.k-bot.ro$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name cert.k-bot.ro;

    ssl_certificate     /etc/letsencrypt/live/cert.k-bot.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cert.k-bot.ro/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # client certificate: asked on this host only
    ssl_client_certificate /etc/nginx/ca/calificate.pem;
    ssl_verify_client      optional;
    ssl_verify_depth       3;

    access_log /var/log/nginx/cert-kbot-ro-access.log;
    error_log  /var/log/nginx/cert-kbot-ro-error.log warn;

    # only the certificate routes exist on this host
    location /api/portal/certificat/ {
        proxy_pass http://127.0.0.1:5009;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SET on every request: whatever the client sends under these names is replaced
        proxy_set_header X-SSL-Verify  $ssl_client_verify;
        proxy_set_header X-SSL-Cert    $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Subject $ssl_client_s_dn;
        proxy_set_header X-SSL-Issuer  $ssl_client_i_dn;
        proxy_set_header X-SSL-End     $ssl_client_v_end;

        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
