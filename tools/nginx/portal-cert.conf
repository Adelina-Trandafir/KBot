# Slice 0110-04: the two origins of the certificate sign-in (read by routes/portal/portal.py).
# Goes to /etc/systemd/system/avacont.service.d/portal-cert.conf on the VPS; then
#   sudo systemctl daemon-reload && sudo systemctl restart avacont
# PORTAL_CERT_ORIGIN : the host that asks for the client certificate (page calls it, CSP allows it)
# PORTAL_SITE_ORIGIN : the site's own address, the only origin the certificate host answers (CORS)
[Service]
Environment="PORTAL_CERT_ORIGIN=https://cert.k-bot.ro"
Environment="PORTAL_SITE_ORIGIN=https://k-bot.ro"
