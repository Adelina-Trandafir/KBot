# Slice 00EF-02. Goes to /etc/systemd/system/avacont.service.d/efactura.conf on the VPS; then
#   sudo systemctl daemon-reload && sudo systemctl restart avacont
# The secrets are in an EnvironmentFile, NOT in Environment= lines: `systemctl show avacont`
# prints Environment= values to any user, an EnvironmentFile only shows its path.
[Service]
EnvironmentFile=/etc/avacont/efactura.env
